name: Build PHP for macOS

# Static PHP builds (CLI and FPM) for tez on Apple silicon, made with static-php-cli. Each build is
# tested against a real PostgreSQL over TCP before it is published to the `builds` release.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "PHP versions, e.g. `8.4` (newest patch) or `8.4.20` (exact). Empty: the newest patch of 8.0 to 8.5."
        required: false
        default: ""
      force:
        description: "Rebuild versions that are already published"
        type: boolean
        default: false
  schedule:
    # Mondays: build new PHP patch releases.
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  SPC_VERSION: "2.8.5"
  RELEASE: builds
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          INPUT: ${{ inputs.versions }}
          FORCE: ${{ inputs.force }}
        run: python3 scripts/plan.py
      - name: Make sure the release exists
        if: steps.plan.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE" -R "$GITHUB_REPOSITORY" --title "PHP builds for tez" \
              --notes "Static PHP builds for macOS on Apple silicon. index.json lists every build with its SHA-256."

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: macos-15
    timeout-minutes: 150
    env:
      V: ${{ matrix.version }}
      ARCH: aarch64
      # static-php-cli fetches some tools and sources through GitHub's API, which limits anonymous calls.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: static-php-cli
        run: |
          curl -fsSL -o spc.tgz "https://github.com/crazywhalecc/static-php-cli/releases/download/$SPC_VERSION/spc-macos-aarch64.tar.gz"
          tar xzf spc.tgz
          chmod +x spc
          ./spc --version

      - name: Extensions for this version
        run: |
          exts=$(tr -d ' \n' < extensions.txt)
          drop() { exts=$(echo "$exts" | tr ',' '\n' | grep -vE "$1" | paste -sd, -); }
          # Swoole 6 (and Laravel Octane) need PHP 8.1 or newer.
          case "$V" in 8.0.*) drop '^swoole' ;; esac
          # PHP 8.4 moved imap out of core (to PECL); static-php-cli 2.8.5 builds it only from core.
          case "$V" in 8.0.*|8.1.*|8.2.*|8.3.*) ;; *) drop '^imap$' ;; esac
          echo "EXTS=$exts" >> "$GITHUB_ENV"
          echo "$exts"

      - uses: actions/cache@v4
        with:
          path: downloads
          key: spc-downloads-${{ env.SPC_VERSION }}-${{ matrix.version }}-${{ hashFiles('extensions.txt') }}
          restore-keys: |
            spc-downloads-${{ env.SPC_VERSION }}-

      - name: Build tools
        run: ./spc doctor --auto-fix

      - name: Download sources
        run: ./spc download --with-php="$V" --for-extensions="$EXTS" --prefer-pre-built --retry=3

      - name: Build
        run: ./spc build "$EXTS" --build-cli --build-fpm --with-suggested-libs --debug

      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.version }}
          path: |
            log/
            source/php-src/config.log
          if-no-files-found: ignore

      - name: Sign
        run: |
          # Stripping can leave an arm64 signature stale; macOS kills binaries whose signature is invalid.
          codesign --force --sign - buildroot/bin/php buildroot/bin/php-fpm
          codesign --verify buildroot/bin/php buildroot/bin/php-fpm

      - name: Test
        run: |
          set -euo pipefail
          B="$PWD/buildroot/bin"
          "$B/php" -v
          "$B/php-fpm" -v
          got=$("$B/php" -r 'echo PHP_VERSION;')
          [ "$got" = "$V" ] || { echo "built PHP $got, wanted $V"; exit 1; }
          "$B/php" -r '
            $need = ["pdo_pgsql", "pgsql", "pdo_mysql", "pdo_sqlite", "mysqli", "redis", "intl", "gd", "imagick", "mbstring", "Zend OPcache", "pcntl", "posix", "sodium", "zip", "curl", "openssl"];
            if (version_compare(PHP_VERSION, "8.1", ">=")) { $need[] = "swoole"; }
            $missing = array_values(array_filter($need, fn ($e) => !extension_loaded($e)));
            if ($missing) { fwrite(STDERR, "missing: " . implode(", ", $missing) . "\n"); exit(1); }
            echo count(get_loaded_extensions()), " extensions; PDO drivers: ", implode(", ", PDO::getAvailableDrivers()), "\n";'

          # The point of these builds: PDO reaches PostgreSQL over TCP on macOS.
          brew list postgresql@17 >/dev/null 2>&1 || brew install --quiet postgresql@17
          PG="$(brew --prefix postgresql@17)/bin"
          "$PG/initdb" -D "$RUNNER_TEMP/pg" -U postgres --auth=trust >/dev/null
          "$PG/pg_ctl" -D "$RUNNER_TEMP/pg" -o "-p 55432 -c listen_addresses=127.0.0.1 -k $RUNNER_TEMP" -l "$RUNNER_TEMP/pg.log" -w start
          for host in 127.0.0.1 "$RUNNER_TEMP"; do
            HOST="$host" perl -e 'alarm 20; exec @ARGV' "$B/php" -r '
              $t = microtime(true);
              $p = new PDO("pgsql:host=" . getenv("HOST") . ";port=55432;dbname=postgres", "postgres", "");
              printf("PDO pgsql via %s: %s in %.3f s\n", getenv("HOST"), $p->query("select 40+2")->fetchColumn(), microtime(true) - $t);'
          done
          "$PG/pg_ctl" -D "$RUNNER_TEMP/pg" stop

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out
          cli="php-$V-cli-macos-$ARCH.tar.gz"
          fpm="php-$V-fpm-macos-$ARCH.tar.gz"
          tar -C buildroot/bin -czf "out/$cli" php
          tar -C buildroot/bin -czf "out/$fpm" php-fpm
          python3 - "$cli" "$fpm" <<'PY'
          import hashlib, json, os, subprocess, sys, datetime
          cli, fpm = sys.argv[1], sys.argv[2]
          sha = lambda f: hashlib.sha256(open(os.path.join("out", f), "rb").read()).hexdigest()
          exts = subprocess.run(["buildroot/bin/php", "-r", "echo implode(',', get_loaded_extensions());"], capture_output=True, text=True, check=True).stdout.split(",")
          v = os.environ["V"]
          rec = {
              "version": v, "minor": ".".join(v.split(".")[:2]), "os": "macos", "arch": os.environ["ARCH"],
              "cli": cli, "cli_sha256": sha(cli), "fpm": fpm, "fpm_sha256": sha(fpm),
              "extensions": sorted(exts, key=str.lower), "static_php_cli": os.environ["SPC_VERSION"],
              "built": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          json.dump(rec, open(f"out/php-{v}-macos-{os.environ['ARCH']}.build.json", "w"), indent=1)
          PY
          ls -la out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE" out/* --clobber -R "$GITHUB_REPOSITORY"

  index:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" --pattern '*.build.json' --dir fragments --clobber
          python3 scripts/index.py
          gh release upload "$RELEASE" index.json --clobber -R "$GITHUB_REPOSITORY"
